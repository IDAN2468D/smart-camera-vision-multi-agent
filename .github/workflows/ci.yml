name: Vision AI Multi-Agent CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Unit & Integration Tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (OpenCV & Audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          playwright install chromium || true

      - name: Run PyTest Test Suite
        env:
          HEADLESS: "true"
          MODEL_ID: "gemini-3.5-flash-lite"
          GEMINI_API_KEY: "dummy_ci_key"
          PYTHONPATH: "."
        run: |
          pytest tests/ -v

  frontend-build:
    name: Frontend Next.js Production Build (Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Next.js Production Container
        run: |
          docker build --progress=plain -t vision-ai-frontend:latest ./frontend

  docker-validate:
    name: Docker Compose Topology Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
