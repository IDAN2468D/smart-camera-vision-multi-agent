name: Vision AI Multi-Agent CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Unit & Integration Tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (OpenCV & Audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run PyTest Test Suite
        env:
          HEADLESS: "true"
          MODEL_ID: "gemini-3.5-flash-lite"
          PYTHONPATH: "."
        run: |
          pytest tests/ -v

  frontend-build:
    name: Frontend Typecheck & Build (Next.js 14)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          rm -f package-lock.json
          npm install

      - name: Run Next.js Production Build
        working-directory: ./frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_ENV: "production"
        run: |
          npm run build

  docker-validate:
    name: Docker Compose Topology Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
